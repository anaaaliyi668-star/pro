<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppy Lovers</title>
    <link rel="stylesheet" href="css/catstyle.css">
</head>
<body>
    <div class="page-wrapper">
        
        <!-- Header with padding -->
        <header class="page-header">
            <h1>Cat lovers page</h1>
        </header>

        <!-- First image - full width, no side margins -->
        <section class="full-width-image">
            <img src="cat images/cat 1.jpg" alt="Puppy">
        </section>

        <!-- Three-column section with equal margins -->
        <section class="three-column-section">
            <div class="column-item">
                <img src="cat images/cat 2.jpg" alt="Puppy">
            </div>
            <div class="column-item missing-box">
                <p>cat missing here!!</p>
            </div>
            <div class="column-item">
                <img src="cat images/cat 3.jpg" alt="Puppy">
            </div>
        </section>

        <!-- More Puppies heading -->
        <h2 class="section-heading">More cats</h2>

        <!-- Two-column section with same spacing as three-column -->
        <section class="two-column-section">
            <div class="column-item">
                <img src="cat images/cat 4.jpg" alt="Puppy">
            </div>
            <div class="column-item">
                <img src="cat images/cat 5.jpg" alt="Puppy">
            </div>
        </section>

        <!-- Footer with wider background and different styling -->
        <footer class="page-footer">
            <p>Developed by: Anwar Aliyi</p>
        </footer>

    </div>
</body>
</html>
